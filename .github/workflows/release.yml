name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/install_plugins.py

      - name: Prepare archive
        run: |
          git add -f .obsidian/plugins
          git add -f .obsidian/community-plugins.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -m "Build release"

      - name: Create archive
        run: |
          git archive \
            --format=zip \
            --prefix="prevault-${{ github.event.release.tag_name }}/" \
            --output="prevault-${{ github.event.release.tag_name }}.zip" \
            HEAD
