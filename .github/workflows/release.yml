name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set build name
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "BUILD_NAME=prevault-${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "BUILD_NAME=prevault-test" >> "$GITHUB_ENV"
          fi

      - name: Install plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/install_plugins.py

      - name: Prepare archive
        run: |
          echo "=== Files after plugin installation ==="
          find .obsidian/plugins -type f

          echo "=== Git status before add ==="
          git status --short --ignored .obsidian/plugins

          git add -f .obsidian/plugins
          git add -f .obsidian/community-plugins.json

          echo "=== Staged files ==="
          git diff --cached --name-status

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -m "Build release"

      - name: Create archive
        run: |
          git archive \
            --format=zip \
            --prefix="$BUILD_NAME/" \
            --output="$BUILD_NAME.zip" \
            HEAD

            echo "=== Files in temporary commit ==="
            git ls-tree -r --name-only HEAD | grep '.obsidian/plugins'
