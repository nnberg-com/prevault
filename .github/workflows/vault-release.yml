name: Build vault release
on:
  push:
    tags: ['vault-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/tests -p 'test_*vault*.py' -v
      - name: Assemble vault
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${RELEASE_REF#vault-}"
          else
            VERSION="preview-${GITHUB_SHA::8}"
          fi
          python3 tools/vault-release.py build "build/vault/Prevault-${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: prevault
          path: build/vault/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/vault-')
    needs: vault
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prevault
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft \
            --title "vault ${RELEASE_TAG#vault-}" \
            --notes 'Скачайте Prevault-*.zip, распакуйте и откройте папку в Obsidian. Инструкция INSTALL.md находится внутри архива. Source code не является готовым хранилищем.'
